[workspace]
resolver = "2"
members = [
  "crates/catcloud-core",
  "crates/catcloud-cli",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"
repository = "https://github.com/JuryBu/CatCloud"
authors = ["CatCloud Contributors"]
description = "CatCloud - Lightweight cross-platform proxy manager with smart multi-select groups and domestic 443 pre-acceleration"

[workspace.dependencies]
tauri = { version = "2.10", features = ["tray-icon", "image-png"] }
tauri-build = "2.5"
tauri-plugin-updater = "2.10"
tauri-plugin-autostart = "2.5"
tauri-plugin-os = "2.3"
tauri-plugin-dialog = "2.6"
tauri-plugin-global-shortcut = "2.3"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "net", "process", "sync", "fs", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "json", "socks", "stream", "gzip", "brotli"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
notify = "8.0"
base64 = "0.22"
url = "2.5"
regex = "1.11"
sysinfo = "0.35"
uuid = { version = "1.16", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Networking_WinInet",
  "Win32_System_Registry",
  "Win32_System_Diagnostics_ToolHelp",
] }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.release.package.rusqlite]
opt-level = 2

[profile.dev]
debug = 0
incremental = true

[profile.test]
debug = 0
incremental = true
